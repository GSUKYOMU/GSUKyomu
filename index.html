<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강서대학교 수업 문의 안내</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .search-box {
            margin: 20px 0;
            text-align: center;
        }
        #globalSearch {
            width: 90%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        #searchResults {
            margin-top: 20px;
            padding: 0 20px;
        }
        .search-result-item {
            display: block;
            padding: 14px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            border-left: 4px solid #007bff;
            transition: all 0.2s;
        }
        .search-result-item:hover {
            background: #e9f5ff;
            transform: translateX(4px);
        }
        .search-result-item strong {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1em;
            margin-bottom: 6px;
        }
        .search-result-item p {
            margin: 0;
            color: #555;
            font-size: 0.95em;
        }
        #searchResults .no-result {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        .main-menu {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <i class="fas fa-graduation-cap" style="margin-right: 8px;"></i>
                강서대학교 수업 문의 안내
            </h1>
            <p class="subtitle">성적 또는 휴·보강 관련 문의를 선택해 주세요.</p>

            <div class="search-box">
                <input type="text" id="globalSearch" placeholder="예: 보강, 복학, 성적 정정, 휴강 승인 등">
            </div>
            <div id="searchResults"></div>
        </header>

        <main class="main-menu">
            <a href="score.html" class="menu-card">
                <i class="fas fa-chart-bar"></i>
                <h2>성적 관련</h2>
                <p>성적 평가, 입력, 제출 서류, 기한 등 확인</p>
            </a>

            <a href="adjust.html" class="menu-card">
                <i class="fas fa-calendar-alt"></i>
                <h2>휴·보강 관련</h2>
                <p>휴강/복학, 보강 신청, 일정 변경 등 확인</p>
            </a>
        </main>
    </div>

    <script>
        const searchableItems = [
            // === adjust.html ===
            {
                keywords: "원칙 휴강 보강 승인 교무처",
                icon: "fa-exclamation-circle",
                title: "휴강 및 보강의 원칙",
                summary: "정당한 사유 외 휴강 불가, 반드시 교무처장 사전 승인 필요",
                link: "adjust.html#원칙"
            },
            {
                keywords: "헤이영 시스템 휴보강 등록 변경",
                icon: "fa-desktop",
                title: "헤이영 시스템 사용 안내",
                summary: "PC/모바일에서 휴강·보강 신청 및 지정보강일 변경 방법",
                link: "adjust.html#헤이영"
            },
            {
                keywords: "계획서 서명 제출 학과장",
                icon: "fa-file-alt",
                title: "휴보강계획서 제출",
                summary: "헤이영에서 출력 후 학과장·교무처 서명 제출 절차",
                link: "adjust.html#계획서"
            },
            {
                keywords: "보고서 보강결과 첨부 증빙",
                icon: "fa-check-circle",
                title: "보강 결과보고서 제출",
                summary: "보강 후 1주일 이내 제출, 대면/온라인 별 첨부 자료 안내",
                link: "adjust.html#보고서"
            },
            {
                keywords: "문의 연락처 교무처 전화 이메일",
                icon: "fa-headset",
                title: "교무처 문의처",
                summary: "수업 관련 문의: 02-2600-2453 또는 kyomu@gangseo.ac.kr",
                link: "adjust.html#문의"
            },

            // === score.html ===
            {
                keywords: "평가기준 상대평가 등급 분포 A+ B F",
                icon: "fa-percent",
                title: "성적평가 기준",
                summary: "상대평가 등급별 분포 비율 및 소수점 처리 규정",
                link: "score.html#평가기준"
            },
            {
                keywords: "상대평가 절대평가 예외 실습 수강인원",
                icon: "fa-ban",
                title: "상대평가 제외 과목",
                summary: "실습·캡스톤·소인원 등 상대평가 적용 제외 조건",
                link: "score.html#절대평가"
            },
            {
                keywords: "평가요소 중간 기말 출석 참여도",
                icon: "fa-list-ol",
                title: "평가 요소 및 비율",
                summary: "출석은 20% 이내 필수 반영, 강의계획서와 반드시 일치해야 함",
                link: "score.html#평가요소"
            },
            {
                keywords: "낙제 F 60점 결석 1/3",
                icon: "fa-times-circle",
                title: "낙제 및 금제 기준",
                summary: "60점 미만 또는 결석 1/3 초과 시 낙제(F) 처리",
                link: "score.html#낙제기준"
            },
            {
                keywords: "제출서류 성적보고서 출석부 CQI",
                icon: "fa-file-contract",
                title: "성적 제출 서류",
                summary: "성적보고서, 출석부, CQI는 담당교수 서명 필수",
                link: "score.html#제출서류"
            },
            {
                keywords: "출석수기 온라인 LMS 헤이영 수기 입력",
                icon: "fa-keyboard",
                title: "온라인 수업 출석 수기 입력",
                summary: "LMS와 헤이영 미연동 시 수기 입력 및 출결 확정 필수",
                link: "score.html#출석수기"
            },
            {
                keywords: "제출기한 제출방법 우편 빠른등기",
                icon: "fa-mail-bulk",
                title: "제출 방법 및 기한",
                summary: "서명된 서류를 빠른등기로 교무처에 마감일 2일 이내 도착",
                link: "score.html#제출기한"
            },
            {
                keywords: "자료보관 10년 보관 성적근거",
                icon: "fa-archive",
                title: "성적 자료 보관",
                summary: "시험지·과제물 등 성적 근거 자료 10년 보관 의무",
                link: "score.html#자료보관"
            },
            {
                keywords: "민원사례 오류 성적오기재 결석 F",
                icon: "fa-exclamation-triangle",
                title: "성적 관련 민원 사례",
                summary: "흔한 오류: 결석 1/3 초과 학생에 성적 부여, 상대평가 미준수 등",
                link: "score.html#민원사례"
            },
            {
                keywords: "기타유의 CQI 조기취업 대체학습",
                icon: "fa-info-circle",
                title: "기타 유의사항",
                summary: "CQI 중요성, 조기취업자 대체학습 확인 및 보관 의무",
                link: "score.html#기타유의"
            }
        ];

        document.getElementById('globalSearch').addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (!query) return;

            const matched = searchableItems.filter(item =>
                (item.keywords + ' ' + item.title + ' ' + item.summary).toLowerCase().includes(query)
            );

            if (matched.length === 0) {
                resultsContainer.innerHTML = '<div class="no-result">검색 결과가 없습니다.</div>';
            } else {
                matched.forEach(item => {
                    const a = document.createElement('a');
                    a.href = item.link;
                    a.className = 'search-result-item';
                    a.innerHTML = `
                        <strong><i class="fas ${item.icon}"></i> ${item.title}</strong>
                        <p>${item.summary}</p>
                    `;
                    resultsContainer.appendChild(a);
                });
            }
        });
    </script>
</body>
</html>
