<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강서대학교 수업 문의 안내</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .search-box {
            margin: 20px 0;
            text-align: center;
        }
        #globalSearch {
            width: 90%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        #searchResults {
            margin-top: 20px;
            padding: 0 20px;
        }
        #searchResults a {
            display: block;
            padding: 10px;
            margin: 8px 0;
            background: #f9f9f9;
            border-left: 3px solid #007bff;
            text-decoration: none;
            color: #333;
            border-radius: 4px;
            transition: background 0.2s;
        }
        #searchResults a:hover {
            background: #e9f5ff;
        }
        #searchResults p {
            color: #888;
            text-align: center;
            margin-top: 15px;
        }
        .main-menu {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <i class="fas fa-graduation-cap" style="margin-right: 8px;"></i>
                강서대학교 수업 문의 안내
            </h1>
            <p class="subtitle">성적 또는 휴·보강 관련 문의를 선택해 주세요.</p>

            <!-- 🔍 검색창 -->
            <div class="search-box">
                <input type="text" id="globalSearch" placeholder="예: 복학, 보강, 성적 정정, 휴강 신청 등">
            </div>
            <div id="searchResults"></div>
        </header>

        <!-- 기존 메뉴 카드 (검색 외에도 유지) -->
        <main class="main-menu">
            <a href="score.html" class="menu-card">
                <i class="fas fa-chart-bar"></i>
                <h2>성적 관련</h2>
                <p>성적 평가, 입력, 제출 서류, 기한 등 확인</p>
            </a>

            <a href="adjust.html" class="menu-card">
                <i class="fas fa-calendar-alt"></i>
                <h2>휴·보강 관련</h2>
                <p>휴강/복학, 보강 신청, 일정 변경 등 확인</p>
            </a>
        </main>
    </div>

    <script>
        // 검색 가능한 항목 목록 (확장 가능)
        const searchableItems = [
            { keywords: "성적 성적평가 평가 기준", text: "성적 평가 기준 확인하기", link: "score.html" },
            { keywords: "성적정정 성적 수정 정정 신청", text: "성적 정정 신청 방법", link: "score.html#성적정정" },
            { keywords: "이의신청 성적 이의", text: "성적 이의신청 절차", link: "score.html#이의신청" },
            { keywords: "휴강 휴강신청 휴학", text: "휴강 신청 절차", link: "adjust.html#휴강" },
            { keywords: "보강 보강신청 보강일", text: "보강 신청 및 일정 안내", link: "adjust.html#보강" },
            { keywords: "복학 복귀 수업복귀", text: "복학 후 수업 관련 안내", link: "adjust.html#복학" },
            { keywords: "헤이영 헤이영시스템 캠퍼스", text: "헤이영 시스템 바로가기", link: "https://campus.heyoung.co.kr/" },
            { keywords: "결강 출석 미출석", text: "결강 및 출석 규정", link: "adjust.html#결강" }
        ];

        document.getElementById('globalSearch').addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (!query) return;

            const matched = searchableItems.filter(item =>
                (item.keywords + ' ' + item.text).toLowerCase().includes(query)
            );

            if (matched.length === 0) {
                resultsContainer.innerHTML = '<p>검색 결과가 없습니다.</p>';
            } else {
                matched.forEach(item => {
                    const a = document.createElement('a');
                    a.href = item.link;
                    a.textContent = item.text;
                    if (item.link.startsWith('http')) {
                        a.target = '_blank';
                        a.rel = 'noopener';
                    }
                    resultsContainer.appendChild(a);
                });
            }
        });
    </script>
</body>
</html>
