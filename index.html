<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강서대학교 수업 문의 안내</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .search-box {
            margin: 20px 0;
            text-align: center;
        }
        #globalSearch {
            width: 90%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        #searchResults {
            margin-top: 20px;
            padding: 0 20px;
        }
        .search-result-item {
            display: block;
            padding: 14px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            border-left: 4px solid #007bff;
            transition: all 0.2s;
        }
        .search-result-item:hover {
            background: #e9f5ff;
            transform: translateX(4px);
        }
        .search-result-item strong {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1em;
            margin-bottom: 6px;
        }
        .search-result-item p {
            margin: 0;
            color: #555;
            font-size: 0.95em;
        }
        #searchResults .no-result {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        .main-menu {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <i class="fas fa-graduation-cap" style="margin-right: 8px;"></i>
                강서대학교 수업 문의 안내
            </h1>
            <p class="subtitle">성적 또는 휴·보강 관련 문의를 선택해 주세요.</p>

            <div class="search-box">
                <input type="text" id="globalSearch" placeholder="예: 보강, 복학, 성적 정정, 휴강 승인 등">
            </div>
            <div id="searchResults"></div>
        </header>

        <main class="main-menu">
            <a href="score.html" class="menu-card">
                <i class="fas fa-chart-bar"></i>
                <h2>성적 관련</h2>
                <p>성적 평가, 입력, 제출 서류, 기한 등 확인</p>
            </a>

            <a href="adjust.html" class="menu-card">
                <i class="fas fa-calendar-alt"></i>
                <h2>휴·보강 관련</h2>
                <p>휴강/복학, 보강 신청, 일정 변경 등 확인</p>
            </a>
        </main>
    </div>

    <script>
        const searchableItems = [
            {
                keywords: "원칙 휴강 보강 승인 교무처",
                icon: "fa-exclamation-circle",
                title: "휴강 및 보강의 원칙",
                summary: "정당한 사유 외 휴강 불가, 반드시 교무처장 사전 승인 필요",
                link: "adjust.html#원칙"
            },
            {
                keywords: "헤이영 시스템 휴보강 등록 변경",
                icon: "fa-desktop",
                title: "헤이영 시스템 사용 안내",
                summary: "PC/모바일에서 휴강·보강 신청 및 지정보강일 변경 방법",
                link: "adjust.html#헤이영"
            },
            {
                keywords: "계획서 서명 제출 학과장",
                icon: "fa-file-alt",
                title: "휴보강계획서 제출",
                summary: "헤이영에서 출력 후 학과장·교무처 서명 제출 절차",
                link: "adjust.html#계획서"
            },
            {
                keywords: "보고서 보강결과 첨부 증빙",
                icon: "fa-check-circle",
                title: "보강 결과보고서 제출",
                summary: "보강 후 1주일 이내 제출, 대면/온라인 별 첨부 자료 안내",
                link: "adjust.html#보고서"
            },
            {
                keywords: "문의 연락처 교무처 전화 이메일",
                icon: "fa-headset",
                title: "교무처 문의처",
                summary: "수업 관련 문의: 02-2600-2453 또는 kyomu@gangseo.ac.kr",
                link: "adjust.html#문의"
            }
            // score.html 항목은 실제 파일 받으면 추가 가능
        ];

        document.getElementById('globalSearch').addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (!query) return;

            const matched = searchableItems.filter(item =>
                (item.keywords + ' ' + item.title + ' ' + item.summary).toLowerCase().includes(query)
            );

            if (matched.length === 0) {
                resultsContainer.innerHTML = '<div class="no-result">검색 결과가 없습니다.</div>';
            } else {
                matched.forEach(item => {
                    const a = document.createElement('a');
                    a.href = item.link;
                    a.className = 'search-result-item';
                    a.innerHTML = `
                        <strong><i class="fas ${item.icon}"></i> ${item.title}</strong>
                        <p>${item.summary}</p>
                    `;
                    resultsContainer.appendChild(a);
                });
            }
        });
    </script>
</body>
</html>
